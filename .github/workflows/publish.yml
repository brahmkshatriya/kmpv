name: kmpv CI and Publish

on:
  pull_request:
    paths:
      - ".github/workflows/publish.yml"
      - "build.gradle.kts"
      - "gradle/**"
      - "gradle.properties"
      - "gradlew"
      - "gradlew.bat"
      - "kmpv/**"
      - "kmpv-render/**"
      - "kmpv-compose/**"
      - "kmpv-android-jni/**"
      - "samples/**"
      - "scripts/**"
      - "settings.gradle.kts"
      - "RELEASING.md"
      - "LICENSE*"
  push:
    branches:
      - "**"
    tags:
      - "v[0-9]*"
      - "[0-9]*"
    paths:
      - ".github/workflows/publish.yml"
      - "build.gradle.kts"
      - "gradle/**"
      - "gradle.properties"
      - "gradlew"
      - "gradlew.bat"
      - "kmpv/**"
      - "kmpv-render/**"
      - "kmpv-compose/**"
      - "kmpv-android-jni/**"
      - "samples/**"
      - "scripts/**"
      - "settings.gradle.kts"
      - "RELEASING.md"
      - "LICENSE*"
  workflow_dispatch:
    inputs:
      version:
        description: "Maven version (required when publishing)"
        required: false
        type: string
      publish:
        description: "Publish the merged repository to Maven Central"
        required: true
        default: false
        type: boolean

concurrency:
  group: kmpv-${{ github.ref }}-${{ (github.event_name == 'workflow_dispatch' && inputs.publish && inputs.version) || 'ci' }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') && !(github.event_name == 'workflow_dispatch' && inputs.publish) }}

permissions:
  contents: read

jobs:
  prepare:
    name: Resolve publication version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Resolve and validate version
        id: version
        shell: bash
        env:
          MANUAL_VERSION: ${{ inputs.version }}
          MANUAL_PUBLISH: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          publish=false
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$MANUAL_PUBLISH" == "true" ]]; then
              publish=true
              if [[ -z "$MANUAL_VERSION" ]]; then
                echo "A version is required for manual publication" >&2
                exit 1
              fi
            fi
            version="${MANUAL_VERSION:-0.1.0-ci.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}}"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            publish=true
            version="${GITHUB_REF_NAME#v}"
          else
            version="0.1.0-ci.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          fi

          if [[ ! "$version" =~ ^[0-9A-Za-z][0-9A-Za-z._-]*$ ]]; then
            echo "Invalid Maven version: $version" >&2
            exit 1
          fi
          if [[ "$version" == *SNAPSHOT* ]]; then
            echo "SNAPSHOT versions are not allowed in isolated publication repositories" >&2
            exit 1
          fi

          if [[ "$publish" == true ]]; then
            if [[ ! -f LICENSE && ! -f LICENSE.txt && ! -f LICENSE.md ]]; then
              echo "A root LICENSE file is required before Maven Central publication." >&2
              exit 1
            fi
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

  quality:
    name: ABI validation
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      KMPV_LINUX_ARM64_CC: aarch64-linux-gnu-gcc
      KMPV_LINUX_ARM64_AR: aarch64-linux-gnu-ar
      KMPV_MINGW_X64_CC: x86_64-w64-mingw32-gcc
      KMPV_MINGW_X64_AR: x86_64-w64-mingw32-ar
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - uses: android-actions/setup-android@v4
      - name: Install Android configuration SDK
        shell: bash
        run: android sdk install platforms/android-37 build-tools/37.0.0
      - name: Install Native cross toolchains
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            binutils-aarch64-linux-gnu \
            binutils-mingw-w64-x86-64 \
            gcc-aarch64-linux-gnu \
            gcc-mingw-w64-x86-64
      - name: Check Kotlin ABI
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --stacktrace --no-configuration-cache \
            :kmpv:checkKotlinAbi \
            :kmpv-render:checkKotlinAbi \
            :kmpv-compose:checkKotlinAbi

  common:
    name: Build root KMP metadata repository
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - uses: android-actions/setup-android@v4
      - name: Install Android configuration SDK
        shell: bash
        run: android sdk install platforms/android-37 build-tools/37.0.0
      - name: Publish root metadata shard
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          repository="$GITHUB_WORKSPACE/release/common-repository"
          rm -rf "$repository"
          bash scripts/publish-ci-shard.sh common "$repository" "$RELEASE_VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: kmpv-repo-common-${{ needs.prepare.outputs.version }}
          path: release/common-repository
          if-no-files-found: error
          retention-days: 7

  linux_x64:
    name: Build Linux x64 repository
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - uses: android-actions/setup-android@v4
      - name: Install Android configuration SDK
        shell: bash
        run: android sdk install platforms/android-37 build-tools/37.0.0
      - name: Install Linux x64 test dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libmpv-dev pkg-config
          libdir="$(pkg-config --variable=libdir mpv)"
          test -n "$libdir"
          test -f "$libdir/libmpv.so"
          echo "KMPV_LINUX_X64_LIBRARY_DIRS=$libdir" >> "$GITHUB_ENV"
      - name: Test Linux x64
        shell: bash
        run: ./gradlew --no-daemon --stacktrace --no-configuration-cache :kmpv:linuxX64Test
      - name: Publish Linux x64 target shard
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          repository="$GITHUB_WORKSPACE/release/linux-x64-repository"
          rm -rf "$repository"
          bash scripts/publish-ci-shard.sh linux-x64 "$repository" "$RELEASE_VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: kmpv-repo-linux-x64-${{ needs.prepare.outputs.version }}
          path: release/linux-x64-repository
          if-no-files-found: error
          retention-days: 7

  linux_arm64:
    name: Build Linux arm64 repository
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      KMPV_LINUX_ARM64_CC: aarch64-linux-gnu-gcc
      KMPV_LINUX_ARM64_AR: aarch64-linux-gnu-ar
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - uses: android-actions/setup-android@v4
      - name: Install Android configuration SDK
        shell: bash
        run: android sdk install platforms/android-37 build-tools/37.0.0
      - name: Install Linux arm64 cross toolchain
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            binutils-aarch64-linux-gnu \
            gcc-aarch64-linux-gnu
      - name: Publish Linux arm64 target shard
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          repository="$GITHUB_WORKSPACE/release/linux-arm64-repository"
          rm -rf "$repository"
          bash scripts/publish-ci-shard.sh linux-arm64 "$repository" "$RELEASE_VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: kmpv-repo-linux-arm64-${{ needs.prepare.outputs.version }}
          path: release/linux-arm64-repository
          if-no-files-found: error
          retention-days: 7

  mingw_x64:
    name: Build MinGW x64 repository
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      KMPV_MINGW_X64_CC: x86_64-w64-mingw32-gcc
      KMPV_MINGW_X64_AR: x86_64-w64-mingw32-ar
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - uses: android-actions/setup-android@v4
      - name: Install Android configuration SDK
        shell: bash
        run: android sdk install platforms/android-37 build-tools/37.0.0
      - name: Install MinGW x64 cross toolchain
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            binutils-mingw-w64-x86-64 \
            gcc-mingw-w64-x86-64
      - name: Publish MinGW x64 target shard
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          repository="$GITHUB_WORKSPACE/release/mingw-x64-repository"
          rm -rf "$repository"
          bash scripts/publish-ci-shard.sh mingw-x64 "$repository" "$RELEASE_VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: kmpv-repo-mingw-x64-${{ needs.prepare.outputs.version }}
          path: release/mingw-x64-repository
          if-no-files-found: error
          retention-days: 7

  android:
    name: Build Android repository
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - uses: android-actions/setup-android@v4
      - name: Install Android native toolchain
        shell: bash
        run: android sdk install platforms/android-37 build-tools/37.0.0 ndk/29.0.14206865 cmake/3.22.1
      - name: Test and assemble Android target
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --stacktrace --no-configuration-cache \
            :kmpv:testAndroidHostTest \
            :kmpv-android-jni:assembleDebug \
            :kmpv:assembleAndroidMain \
            :kmpv-render:assembleAndroidMain \
            :kmpv-compose:assembleAndroidMain \
            :samples:android:assembleDebug
      - name: Publish Android AARs
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          repository="$GITHUB_WORKSPACE/release/android-repository"
          rm -rf "$repository"
          bash scripts/publish-ci-shard.sh android "$repository" "$RELEASE_VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: kmpv-repo-android-${{ needs.prepare.outputs.version }}
          path: release/android-repository
          if-no-files-found: error
          retention-days: 7

  macos_x64:
    name: Build macOS x64 repository
    needs: prepare
    runs-on: macos-15-intel
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 12266719
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"
      - name: Publish macOS x64 target shard
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          test "$(uname -m)" = "x86_64"
          repository="$GITHUB_WORKSPACE/release/macos-x64-repository"
          rm -rf "$repository"
          bash scripts/publish-ci-shard.sh macos-x64 "$repository" "$RELEASE_VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: kmpv-repo-macos-x64-${{ needs.prepare.outputs.version }}
          path: release/macos-x64-repository
          if-no-files-found: error
          retention-days: 7

  macos_arm64:
    name: Build macOS arm64 repository
    needs: prepare
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 12266719
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"
      - name: Publish macOS arm64 target shard
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          test "$(uname -m)" = "arm64"
          repository="$GITHUB_WORKSPACE/release/macos-arm64-repository"
          rm -rf "$repository"
          bash scripts/publish-ci-shard.sh macos-arm64 "$repository" "$RELEASE_VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: kmpv-repo-macos-arm64-${{ needs.prepare.outputs.version }}
          path: release/macos-arm64-repository
          if-no-files-found: error
          retention-days: 7

  ios_arm64:
    name: Build iOS arm64 repository
    needs: prepare
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 12266719
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"
      - name: Publish iOS arm64 target shard
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          test "$(uname -m)" = "arm64"
          repository="$GITHUB_WORKSPACE/release/ios-arm64-repository"
          rm -rf "$repository"
          bash scripts/publish-ci-shard.sh ios-arm64 "$repository" "$RELEASE_VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: kmpv-repo-ios-arm64-${{ needs.prepare.outputs.version }}
          path: release/ios-arm64-repository
          if-no-files-found: error
          retention-days: 7

  merge:
    name: Merge and verify complete Maven repository
    needs:
      - prepare
      - quality
      - common
      - linux_x64
      - linux_arm64
      - mingw_x64
      - android
      - macos_x64
      - macos_arm64
      - ios_arm64
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/download-artifact@v4
        with:
          pattern: kmpv-repo-*-${{ needs.prepare.outputs.version }}
          path: release/shards
      - name: Merge and verify repository
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          SHOULD_PUBLISH: ${{ needs.prepare.outputs.publish }}
        run: |
          set -euo pipefail
          mapfile -t shards < <(find release/shards -mindepth 1 -maxdepth 1 -type d -print | sort)
          test "${#shards[@]}" -eq 8
          python3 scripts/merge-kmpv-repositories.py \
            release/maven-repository "${shards[@]}"

          verify_args=()
          if [[ "$SHOULD_PUBLISH" == true ]]; then
            verify_args+=(--central-ready)
          fi
          python3 scripts/verify-kmpv-repository.py \
            release/maven-repository "$RELEASE_VERSION" "${verify_args[@]}"
          bash scripts/verify-kmpv-consumer.sh \
            release/maven-repository "$RELEASE_VERSION"
          du -sh release/maven-repository
      - uses: actions/upload-artifact@v4
        with:
          name: kmpv-maven-repo-${{ needs.prepare.outputs.version }}
          path: release/maven-repository
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish exact repository to Maven Central
    if: needs.prepare.outputs.publish == 'true'
    needs:
      - prepare
      - merge
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v4
        with:
          name: kmpv-maven-repo-${{ needs.prepare.outputs.version }}
          path: release/maven-repository
      - name: Restore Central credentials and signing key
        shell: bash
        env:
          GRADLE_PROPERTIES_CONTENT: ${{ secrets.GRADLE_PROPERTIES_CONTENT }}
          GPG_SECRET_KEY_RING_BASE64: ${{ secrets.GPG_SECRET_KEY_RING_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$GRADLE_PROPERTIES_CONTENT"
          test -n "$GPG_SECRET_KEY_RING_BASE64"
          gradle_dir="$HOME/.gradle"
          properties_file="$gradle_dir/gradle.properties"
          keyring="$gradle_dir/kmpv-secret-key.gpg"
          mkdir -p "$gradle_dir"
          printf '%s' "$GRADLE_PROPERTIES_CONTENT" > "$properties_file"
          printf '%s' "$GPG_SECRET_KEY_RING_BASE64" | tr -d '\r\n ' | openssl base64 -d -A > "$keyring"
          test -s "$keyring"
          awk '!/^signing.secretKeyRingFile=/' "$properties_file" > "$properties_file.tmp"
          mv "$properties_file.tmp" "$properties_file"
          printf '\nsigning.secretKeyRingFile=%s\n' "$keyring" >> "$properties_file"
          chmod 600 "$properties_file" "$keyring"
      - name: Sign and publish one Central deployment
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          bash scripts/publish-kmpv-central-bundle.sh \
            "$GITHUB_WORKSPACE/release/maven-repository" \
            "$RELEASE_VERSION" \
            "$GITHUB_WORKSPACE/release/kmpv-$RELEASE_VERSION.zip"
      - name: Preserve failed Central bundle
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failed-kmpv-central-bundle-${{ needs.prepare.outputs.version }}
          path: release/kmpv-${{ needs.prepare.outputs.version }}.zip
          if-no-files-found: ignore
          retention-days: 7
